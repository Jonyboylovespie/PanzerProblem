<!DOCTYPE html>
<html>
<head>
    <title>Game Server</title>
</head>
<body>
<h1>Game Server</h1>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="alert">
            {{ messages[0] }}
        </div>
    {% endif %}
{% endwith %}

<div>
    <h2>Create a New Game</h2>
    <form action="/create" method="post">
        <input type="text" name="host_name" placeholder="Your Name" required>
        <button type="submit">Create Game</button>
    </form>
</div>

<div>
    <div>
        <h2>Join a Game</h2>
        <form action="/join" method="post">
            <input type="text" name="game_code" placeholder="Game Code" value="{{ request.args.get("game_code", "") }}" required>
            <input type="text" name="player_name" placeholder="Your Name" required>
            <button type="submit">Join Game</button>
        </form>
    </div>
</div>
</body>
</html>
