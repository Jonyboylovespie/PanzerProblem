{% extends "base.html" %}
{% block title %}Join Game{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
{% endblock %}
{% block body %}
<main class="join-page">
    <h1>Join Game</h1>
    <section class="panel">
        <h2>{{ host }}'s game</h2>
        <p class="help-text">Game code: {{ game_code }}</p>
        <form action="{{ url_for('join_game') }}" method="post">
            <input type="hidden" name="game_code" value="{{ game_code }}" />
            <label for="player-name">Your name</label>
            <input id="player-name" type="text" name="player_name" placeholder="Your Name" required autofocus />
            <button type="submit">Join Game</button>
        </form>
        <a class="back-link" href="{{ url_for('home', _anchor='join') }}">Back to games</a>
    </section>
</main>
{% endblock %}
